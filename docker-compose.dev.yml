services:
  signaling:
    container_name: broference-dev-signaling
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "0.0.0.0:8765:8765"
      - "[::]:8765:8765"
    volumes:
      - ./ssl:/app/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    container_name: broference-dev-web
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "0.0.0.0:443:443"
      - "[::]:443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
