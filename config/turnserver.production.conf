# Coturn TURN Server - Production Configuration for broference.cam
# This configuration is optimized for internet-facing WebRTC deployments

# Listening port for TURN server
listening-port=3479

# TLS listening port (optional, for secure connections)
# Uncomment if you have SSL certificates for TURN
# tls-listening-port=5349
# cert=/path/to/cert.pem
# pkey=/path/to/key.pem

# Relay IP - Don't set this for Docker, let it auto-detect
# Or use 0.0.0.0 to listen on all interfaces
listening-ip=0.0.0.0

# NO external-ip here: the VPS has its public IP directly on the NIC (no NAT),
# and setting external-ip makes coturn remap peer addresses matching the public
# IP before the allowed-peer-ip check, 403'ing same-server relay paths
# (2026-07-17 outage). update-vps.sh strips any external-ip line on deploy.

# Allow hairpin relay: permit CREATE_PERMISSION to the server's own public IP
# so both peers on the same TURN server can relay through it.
# update-vps.sh rewrites these to the detected public IP + turn2's IP on deploy.
allowed-peer-ip=66.228.56.250

# Relay ports range - These ports must be open in your firewall
min-port=49152
max-port=65535

# Verbose logging (disable in production if too much)
verbose

# Use fingerprints in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# User accounts for TURN authentication
# Format: username:password
# IMPORTANT: Change these credentials in production!
user=webrtc:M6vxdxo7HkzpvTxVWX0auQe8vkVFUPi

# Realm for TURN authentication - should match your domain
realm=broference.cam

# Log file - written to mounted host volume for fail2ban
log-file=/var/log/coturn/turnserver.log

# Performance tuning
# max-bps=0  # No bandwidth limit
# bps-capacity=0  # No bandwidth limit

# Security settings
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Disable loopback peers (prevent localhost connections in production)
# Uncomment for production security
# no-loopback-peers

# Rate limiting (uncomment for production)
# user-quota=0  # Unlimited sessions per user
# total-quota=100  # Max 100 concurrent sessions
