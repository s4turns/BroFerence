services:
  # TURN Server (Coturn)
  turn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - type: bind
        source: ./config/turnserver.production.conf
        target: /etc/coturn/turnserver.conf
        read_only: true
      - ./logs/coturn:/var/log/coturn
    command: -c /etc/coturn/turnserver.conf
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WebRTC Signaling Server
  signaling:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "0.0.0.0:8765:8765"
      - "[::]:8765:8765"
      # WebTransport-over-QUIC signaling. The /udp suffix is mandatory:
      # without it Docker publishes TCP and the handshake never arrives.
      - "0.0.0.0:8767:8767/udp"
      - "[::]:8767:8767/udp"
    volumes:
      - ./ssl:/app/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Web Client Server
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "0.0.0.0:8080:80"
      - "[::]:8080:80"
      - "0.0.0.0:443:443"
      - "[::]:443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
